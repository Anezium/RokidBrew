<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050505">
    <title>RokidBrew Store</title>
    <link rel="icon" href="logo-256.png">
    <link rel="apple-touch-icon" href="logo-256.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#/" aria-label="RokidBrew home">
          <img class="brand-logo" src="logo-256.png" alt="">
          <span class="brand-name">Rokid<span>Brew</span></span>
        </a>
        <a class="phone-cta is-loading" id="phoneAppButton" href="#" aria-disabled="true">
          Get the phone app
        </a>
      </div>
    </header>

    <main id="app" class="app-shell" tabindex="-1"></main>

    <footer class="site-footer" id="siteFooter"></footer>

    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" type="button" aria-label="Close screenshot">×</button>
      <img id="lightboxImage" alt="">
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
